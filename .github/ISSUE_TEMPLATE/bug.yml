name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: ["tipo:bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options: [Local, Homologação, Produção]
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Navegador e dispositivo
      placeholder: Chrome 140, Android
  - type: input
    id: requisitos
    attributes:
      label: RF/RN relacionados
      placeholder: RF-006, RN-002
  - type: textarea
    id: evidencias
    attributes:
      label: Prints ou logs
      description: Não inclua dados pessoais reais de leads.
