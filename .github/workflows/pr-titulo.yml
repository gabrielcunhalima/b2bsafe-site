# O título do PR vira a mensagem do commit no merge por squash, então precisa seguir
# Conventional Commits (base do changelog). Não faz checkout do código do PR.
name: Título do PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  titulo:
    name: Título no padrão Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
            style
            revert
          requireScope: false
          # A descrição é em português e pode começar com minúscula
          subjectPattern: ^.+$
